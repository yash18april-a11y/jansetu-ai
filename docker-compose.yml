services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jansetu
      MYSQL_USER: jansetu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes: [mysql_data:/var/lib/mysql]
    
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 10
  api:
    build: ./backend
    volumes:
      - ./backend/schemes.json:/app/schemes.json:ro
    environment:
      DATABASE_URL: mysql+pymysql://jansetu:${MYSQL_PASSWORD}@mysql:3306/jansetu
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:5000:10000"]
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  mysql_data:

